<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InventoryX - Categories</title>
  <link rel="stylesheet" href="inventory.css">
</head>
<body>

  <main class="container">

    <div class="page-header">
      <div>
        <h2>Categories</h2>
        <p class="page-subtitle">Step 1: create the categories your devices belong to, like Box Office or Cashless.</p>
      </div>
      <a href="device-types.html" class="btn-secondary">Next: Device Types →</a>
    </div>

    <div class="card add-form">
      <h3 class="section-title">Create a category</h3>
      <form class="inline-add" id="add-category-form">
        <input type="text" id="new-category-name" placeholder="e.g. Cashless" maxlength="40" required>
        <button type="submit" class="btn-add" id="create-category-btn">Create category</button>
      </form>
      <p class="form-error" id="category-error"></p>
      <p class="form-success" id="category-success"></p>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Category</th>
            <th>Device Types</th>
            <th>Devices</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="category-table-body">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <script src="categories.js"></script>
  <script src="layout.js"></script>

</body>
</html>
