<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InventoryX - Sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box">
    <h1>InventoryX</h1>
    <p id="login-subtitle">Sign in to manage devices and events</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@company.com" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>

      <p class="login-error" id="login-error"></p>

      <button type="submit" id="login-btn">Sign in</button>
    </form>

    <form id="setup-form" class="hidden">
      <p class="login-note">Welcome! Create the first admin account. You can add your team after signing in.</p>

      <label for="setup-name">Your name</label>
      <input type="text" id="setup-name" autocomplete="name" required>

      <label for="setup-email">Email</label>
      <input type="email" id="setup-email" placeholder="you@company.com" autocomplete="username" required>

      <label for="setup-password">Password (at least 8 characters)</label>
      <input type="password" id="setup-password" minlength="8" autocomplete="new-password" required>

      <label for="setup-confirm">Confirm password</label>
      <input type="password" id="setup-confirm" minlength="8" autocomplete="new-password" required>

      <p class="login-error" id="setup-error"></p>

      <button type="submit" id="setup-btn">Create admin account</button>
    </form>
  </div>

  <script src="login.js"></script>
</body>
</html>
