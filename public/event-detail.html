<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atomx Inventory - Event</title>
  <link rel="stylesheet" href="inventory.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Atomx Inventory</div>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="inventory.html">Master Inventory</a></li>
      <li><a href="events.html" class="active">Events</a></li>
      <li><a href="index.html">Logout</a></li>
    </ul>
  </nav>

  <main class="container">

    <a href="events.html" class="back-link">← Back to Events</a>

    <p class="empty-note" id="page-message">Loading event...</p>

    <div id="page-content" class="hidden">

      <div class="page-header">
        <div class="title-with-status">
          <h2 id="event-name"></h2>
          <span class="status" id="event-status"></span>
        </div>
      </div>

      <div class="detail-grid">
        <div class="card">
          <h3 class="section-title">Event details</h3>
          <dl class="details">
            <dt>Dates</dt>
            <dd id="event-dates"></dd>
            <dt>Location</dt>
            <dd id="event-location"></dd>
            <dt>Submitted on</dt>
            <dd id="event-created"></dd>
            <dt>Created by</dt>
            <dd id="event-source"></dd>
            <dt>Notes</dt>
            <dd id="event-notes"></dd>
          </dl>
        </div>

        <div class="card">
          <h3 class="section-title">Requested by</h3>
          <dl class="details">
            <dt>Name</dt>
            <dd id="req-name"></dd>
            <dt>Email</dt>
            <dd id="req-email"></dd>
            <dt>Phone</dt>
            <dd id="req-phone"></dd>
            <dt>Extra emails</dt>
            <dd id="req-cc"></dd>
          </dl>
        </div>
      </div>

      <div id="assign-section" class="hidden">
        <div class="card assign-card">
          <h3 class="section-title">Assign devices</h3>
          <div id="assign-groups"></div>

          <div class="email-section">
            <label class="checkbox-label">
              <input type="checkbox" id="send-email" checked>
              <span id="send-email-label">Send confirmation email to the requester</span>
            </label>
            <label for="extra-emails">Also send to</label>
            <input type="text" id="extra-emails">
          </div>
        </div>

        <p class="form-error" id="assign-error"></p>

        <div class="form-actions">
          <a href="events.html" class="btn-secondary">Cancel</a>
          <button type="button" class="btn-add" id="confirm-btn">Confirm assignment</button>
        </div>
      </div>

      <div id="assigned-section" class="hidden">
        <div class="card assign-card">
          <h3 class="section-title">Assigned items</h3>
          <p class="page-subtitle" id="assigned-at"></p>
          <ul class="panel-list" id="assigned-list"></ul>
        </div>
      </div>

    </div>

  </main>

  <script src="event-detail.js"></script>

</body>
</html>
