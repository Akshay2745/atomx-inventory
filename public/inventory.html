<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atomx Inventory - Master Inventory</title>
  <link rel="stylesheet" href="inventory.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Atomx Inventory</div>
    <ul class="nav-links">
      <li><a href="inventory.html" class="active">Master Inventory</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="index.html">Logout</a></li>
    </ul>
  </nav>

  <main class="container">

    <div class="page-header">
      <h2>Master Inventory</h2>
      <button class="btn-add" id="add-device-btn">+ Add Device</button>
    </div>

    <div class="card add-form hidden" id="add-device-panel">
      <h3 class="section-title">Add a new device</h3>
      <form id="add-device-form">
        <div class="add-form-grid">
          <div>
            <label for="new-serial">Serial number</label>
            <input type="text" id="new-serial" placeholder="e.g. POS-0005" required>
          </div>
          <div>
            <label for="new-name">Device type</label>
            <select id="new-name" required>
              <option value="">Select type</option>
              <option value="POS Terminal">POS Terminal</option>
              <option value="Soundbox">Soundbox</option>
              <option value="Card Reader">Card Reader</option>
              <option value="QR Standee">QR Standee</option>
            </select>
          </div>
          <div>
            <label for="new-category">Category</label>
            <select id="new-category" required>
              <option value="">Select category</option>
              <option value="Payment Device">Payment Device</option>
              <option value="Display Item">Display Item</option>
              <option value="Accessory">Accessory</option>
            </select>
          </div>
        </div>
        <p class="form-error" id="form-error"></p>
        <div class="form-actions">
          <button type="button" class="btn-secondary" id="cancel-add-btn">Cancel</button>
          <button type="submit" class="btn-add">Save device</button>
        </div>
      </form>
    </div>

    <div class="summary-cards">
      <div class="card">
        <h3>Total Devices</h3>
        <p class="card-number" id="total-count">0</p>
      </div>
      <div class="card">
        <h3>In Office</h3>
        <p class="card-number" id="office-count">0</p>
      </div>
      <div class="card">
        <h3>Assigned to Events</h3>
        <p class="card-number" id="assigned-count">0</p>
      </div>
      <div class="card">
        <h3>Missing</h3>
        <p class="card-number" id="missing-count">0</p>
      </div>
    </div>

    <div class="toolbar">
      <input type="search" id="search-input" class="search-input" placeholder="Search by serial number, device or event...">
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Serial Number</th>
            <th>Device</th>
            <th>Category</th>
            <th>Status</th>
            <th>Current Event</th>
          </tr>
        </thead>
        <tbody id="device-table-body">
          <!-- JavaScript fills this in -->
        </tbody>
      </table>
    </div>

  </main>

  <script src="inventory.js"></script>

</body>
</html>
