<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atomx Inventory - Create Event</title>
  <link rel="stylesheet" href="request.css">
</head>
<body>

  <div class="form-container">
    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    <h1>Create Event</h1>
    <p class="subtitle">Create an event on behalf of a team member. It will appear on the dashboard, ready for you to assign devices.</p>

    <form id="request-form" data-source="manager" data-redirect="dashboard.html">

      <fieldset>
        <legend>Event details</legend>

        <label for="event-name">Event name</label>
        <input type="text" id="event-name" placeholder="e.g. Mumbai Fintech Expo" required>

        <div class="form-row">
          <div>
            <label for="start-date">Start date</label>
            <input type="date" id="start-date" required>
          </div>
          <div>
            <label for="end-date">End date</label>
            <input type="date" id="end-date" required>
          </div>
        </div>

        <label for="location">Location</label>
        <input type="text" id="location" placeholder="City and venue" required>
      </fieldset>

      <fieldset>
        <legend>Person going to the event</legend>

        <div class="form-row">
          <div>
            <label for="requester-name">Name</label>
            <input type="text" id="requester-name" required>
          </div>
          <div>
            <label for="requester-email">Email</label>
            <input type="email" id="requester-email" placeholder="name@company.com" required>
          </div>
        </div>

        <label for="contact-phone">Contact phone</label>
        <input type="tel" id="contact-phone" placeholder="e.g. 98765 43210" pattern="[0-9 ]{10,12}" required>

        <label for="cc-emails">Extra emails for confirmation (optional)</label>
        <input type="text" id="cc-emails" placeholder="e.g. coo@company.com, manager@company.com">
        <small class="hint">Separate multiple emails with commas</small>
      </fieldset>

      <fieldset>
        <legend>Items needed</legend>

        <div id="item-rows">
          <!-- JavaScript adds item rows here -->
        </div>

        <button type="button" class="btn-add-item" id="add-item-btn">+ Add another item</button>
      </fieldset>

      <label for="notes">Notes (optional)</label>
      <textarea id="notes" rows="3" placeholder="Anything to remember about this event"></textarea>

      <p class="form-error" id="request-error"></p>

      <button type="submit" class="btn-submit">Create event</button>

    </form>
  </div>

  <script src="request.js"></script>

</body>
</html>
