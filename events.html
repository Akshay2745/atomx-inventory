<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atomx Inventory - Events</title>
  <link rel="stylesheet" href="inventory.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Atomx Inventory</div>
    <ul class="nav-links">
      <li><a href="inventory.html">Master Inventory</a></li>
      <li><a href="events.html" class="active">Events</a></li>
      <li><a href="index.html">Logout</a></li>
    </ul>
  </nav>

  <main class="container">

    <div class="page-header">
      <h2>Events</h2>
      <a href="request.html" target="_blank" rel="noopener" class="btn-add">Open request form</a>
    </div>

    <div class="summary-cards">
      <div class="card">
        <h3>New Requests</h3>
        <p class="card-number" id="requested-count">0</p>
      </div>
      <div class="card">
        <h3>Assigned</h3>
        <p class="card-number" id="assigned-count">0</p>
      </div>
      <div class="card">
        <h3>Out at Event</h3>
        <p class="card-number" id="out-count">0</p>
      </div>
      <div class="card">
        <h3>Closed</h3>
        <p class="card-number" id="closed-count">0</p>
      </div>
    </div>

    <div class="filter-tabs">
      <button class="tab active" data-status="All">All</button>
      <button class="tab" data-status="Requested">Requested</button>
      <button class="tab" data-status="Assigned">Assigned</button>
      <button class="tab" data-status="Out at Event">Out at Event</button>
      <button class="tab" data-status="Closed">Closed</button>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Event Name</th>
            <th>Dates</th>
            <th>Location</th>
            <th>Requested By</th>
            <th>Items</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="events-table-body">
          <!-- JavaScript fills this in -->
        </tbody>
      </table>
    </div>

  </main>

  <script src="events.js"></script>

</body>
</html>
